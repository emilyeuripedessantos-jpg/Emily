

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Interativo - Votação Permanente</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #eef2f3;
            margin: 0;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }

        h3 { color: #333; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; line-height: 1.5; }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            background: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
        }

        .btn-like.active {
            background-color: #e7f3ff;
            color: #1877f2;
            border-color: #1877f2;
        }

        .btn-dislike.active {
            background-color: #ffebe9;
            color: #e41e3f;
            border-color: #e41e3f;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>Publicação Global</h3>
        <p>Os votos dados aqui ficam salvos direto no servidor. Atualize a página à vontade para testar!</p>
        
        <div class="buttons-container">
            <button class="btn btn-like" id="likeBtn">
                👍 <span id="likeCount">0</span>
            </button>
            
            <button class="btn btn-dislike" id="dislikeBtn">
                👎 <span id="dislikeCount">0</span>
            </button>
        </div>
    </div>

    <script>
        const likeBtn = document.getElementById('likeBtn');
        const dislikeBtn = document.getElementById('dislikeBtn');
        const likeCount = document.getElementById('likeCount');
        const dislikeCount = document.getElementById('dislikeCount');

        let likes = 0;
        let dislikes = 0;
        let userAction = null; // Controla apenas a ação local do navegador atual

        // 1. Busca os números iniciais salvos no servidor ao carregar a página
        async function carregarVotosIniciais() {
            try {
                const resposta = await fetch('/api/votos');
                const dados = await resposta.json();
                likes = dados.likes || 0;
                dislikes = dados.dislikes || 0;
                atualizarInterface();
            } catch (erro) {
                console.error('Erro ao buscar dados iniciais:', erro);
            }
        }

        // 2. Envia os novos valores calculados para salvar permanentemente
        async function salvarNoServidor() {
            try {
                await fetch('/api/votos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ likes, dislikes })
                });
            } catch (erro) {
                console.error('Erro ao salvar os votos:', erro);
            }
        }

        function atualizarInterface() {
            likeCount.textContent = likes;
            dislikeCount.textContent = dislikes;
        }

        // Evento de clique em curtir
        likeBtn.addEventListener('click', async () => {
            if (userAction === 'liked') {
                likes--;
                userAction = null;
                likeBtn.classList.remove('active');
            } else {
                if (userAction === 'disliked') {
                    dislikes--;
                    dislikeBtn.classList.remove('active');
                }
                likes++;
                userAction = 'liked';
                likeBtn.classList.add('active');
            }
            atualizarInterface();
            await salvarNoServidor();
        });

        // Evento de clique em descurtir
        dislikeBtn.addEventListener('click', async () => {
            if (userAction === 'disliked') {
                dislikes--;
                userAction = null;
                dislikeBtn.classList.remove('active');
            } else {
                if (userAction === 'liked') {
                    likes--;
                    likeBtn.classList.remove('active');
                }
                dislikes++;
                userAction = 'disliked';
                dislikeBtn.classList.add('active');
            }
            atualizarInterface();
            await salvarNoServidor();
        });

        // Executa a carga inicial quando abre o site
        carregarVotosIniciais();
    </script>
</body>
</html>
